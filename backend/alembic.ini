[alembic]
script_location = alembic
prepend_sys_path = .
# NOTE: keep this file ASCII-only. alembic reads it with configparser
# encoding="locale" (GBK on zh-CN Windows), so any non-ASCII byte (even a
# UTF-8 Chinese comment) breaks `alembic upgrade` with UnicodeDecodeError.
# URL is read from app settings by alembic/env.py, left empty here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
